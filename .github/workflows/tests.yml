name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Static checks
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes indtrader tests tools
      - name: Tests (offline, recorded market snapshots)
        run: python -m unittest discover -s tests -v
